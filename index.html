 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#126b48">
<title>Meu Financeiro</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#18251f;background:#f3f6f4}
*{box-sizing:border-box}
body{margin:0}
header{background:#126b48;color:white;padding:26px 20px 30px;border-radius:0 0 25px 25px}
header small{opacity:.85}
h1{margin:6px 0 20px;font-size:27px}
.balance{font-size:34px;font-weight:750;margin:8px 0}
main{padding:16px;max-width:600px;margin:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;padding:15px;border-radius:15px;box-shadow:0 2px 10px #14281a0b}
.card small{color:#66756d}
.card strong{display:block;margin-top:8px;font-size:19px;overflow-wrap:anywhere}
section{background:white;padding:17px;border-radius:17px;margin-top:15px}
h2{font-size:18px;margin:0 0 14px}
label{display:block;font-size:13px;color:#52635a;margin:12px 0 6px}
input,select,button{font:inherit;width:100%;padding:13px;border-radius:10px}
input,select{border:1px solid #d8e1db;background:white;color:#18251f}
button{border:0;background:#126b48;color:white;font-weight:650;margin-top:14px;cursor:pointer}
button.secondary{background:#e5eee8;color:#126b48}
.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf0ed}
.item:last-child{border:0}
.item small{display:block;color:#738078;margin-top:5px}
.amount{font-weight:700;white-space:nowrap}
.income{color:#13824f}.expense{color:#c33c42}
.delete{width:auto;padding:6px 10px;margin:7px 0 0;background:#fbe9e9;color:#a42b30;font-size:12px}
.empty{color:#718077;font-size:14px;padding:8px 0}
footer{text-align:center;color:#77857c;font-size:12px;padding:22px}
</style>
</head>
<body>
<header>
  <small>SEU CONTROLE FINANCEIRO</small>
  <h1>Meu Financeiro 💚</h1>
  <small>Saldo disponível</small>
  <div class="balance" id="saldo">R$ 0,00</div>
  <small id="mes"></small>
</header>
<main>
  <div class="cards">
    <div class="card"><small>Entradas</small><strong class="income" id="entradas">R$ 0,00</strong></div>
    <div class="card"><small>Despesas</small><strong class="expense" id="despesas">R$ 0,00</strong></div>
  </div>
  <section>
    <h2>➕ Novo lançamento</h2>
    <form id="form">
      <label for="descricao">O que foi?</label>
      <input id="descricao" placeholder="Ex.: salário, aluguel, capina" required maxlength="100">
      <label for="valor">Valor em reais</label>
      <input id="valor" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00" required>
      <label for="tipo">Tipo de lançamento</label>
      <select id="tipo"><option value="entrada">Entrada de dinheiro</option><option value="despesa">Despesa</option></select>
      <label for="data">Data</label>
      <input id="data" type="date" required>
      <button type="submit">Salvar lançamento</button>
    </form>
  </section>
  <section>
    <h2>📋 Histórico</h2>
    <div id="historico"><p class="empty">Seus lançamentos aparecerão aqui.</p></div>
    <button class="secondary" id="exportar" type="button">Exportar meus dados</button>
  </section>
  <footer>Seus lançamentos ficam salvos neste navegador. Evite apagar os dados do site sem fazer uma cópia de segurança.</footer>
</main>
<script>
const chave="meuFinanceiroLancamentosV1";
const dinheiro=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hoje=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
document.getElementById("data").value=hoje();
document.getElementById("mes").textContent=new Date().toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
let lancamentos=[];
try{lancamentos=JSON.parse(localStorage.getItem(chave)||"[]");if(!Array.isArray(lancamentos))lancamentos=[]}catch(e){lancamentos=[]}
function salvar(){try{localStorage.setItem(chave,JSON.stringify(lancamentos));return true}catch(e){alert("Não foi possível salvar. Confira o espaço disponível no navegador.");return false}}
function render(){
 const entradas=lancamentos.filter(x=>x.tipo==="entrada").reduce((s,x)=>s+x.valor,0);
 const despesas=lancamentos.filter(x=>x.tipo==="despesa").reduce((s,x)=>s+x.valor,0);
 document.getElementById("saldo").textContent=dinheiro(entradas-despesas);
 document.getElementById("entradas").textContent=dinheiro(entradas);
 document.getElementById("despesas").textContent=dinheiro(despesas);
 const area=document.getElementById("historico");area.replaceChildren();
 if(!lancamentos.length){const p=document.createElement("p");p.className="empty";p.textContent="Seus lançamentos aparecerão aqui.";area.append(p);return}
 [...lancamentos].reverse().forEach(x=>{
  const item=document.createElement("div");item.className="item";
  const info=document.createElement("div");const nome=document.createElement("strong");nome.textContent=x.descricao;
  const data=document.createElement("small");data.textContent=new Date(x.data+"T12:00:00").toLocaleDateString("pt-BR");
  const excluir=document.createElement("button");excluir.type="button";excluir.className="delete";excluir.textContent="Excluir lançamento";excluir.onclick=()=>{if(confirm("Excluir este lançamento?")){lancamentos=lancamentos.filter(y=>y.id!==x.id);salvar();render()}};
  info.append(nome,data,document.createElement("br"),excluir);
  const valor=document.createElement("div");valor.className="amount "+(x.tipo==="entrada"?"income":"expense");valor.textContent=(x.tipo==="entrada"?"+ ":"− ")+dinheiro(x.valor);
  item.append(info,valor);area.append(item)
 })
}
document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 const descricao=document.getElementById("descricao").value.trim();
 const valor=Number(document.getElementById("valor").value);
 const data=document.getElementById("data").value;
 if(!descricao||!Number.isFinite(valor)||valor<=0||!data){alert("Confira a descrição, o valor e a data.");return}
 lancamentos.push({id:Date.now().toString()+Math.random().toString(16).slice(2),descricao,valor,tipo:document.getElementById("tipo").value,data});
 if(salvar()){render();e.target.reset();document.getElementById("data").value=hoje()}
});
document.getElementById("exportar").addEventListener("click",()=>{
 const blob=new Blob([JSON.stringify(lancamentos,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="meu-financeiro-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
});
render();
</script>
</body>
</html>
